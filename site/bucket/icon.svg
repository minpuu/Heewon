<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="버킷리스트 노트">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5539"/>
      <stop offset="0.55" stop-color="#62422D"/>
      <stop offset="1" stop-color="#513424"/>
