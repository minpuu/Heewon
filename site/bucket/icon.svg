  <rect x="45" y="45" width="422" height="422" rx="16" fill="none" stroke="#E4D8C4" stroke-width="1"/>
  <rect x="45" y="45" width="422" height="422" rx="16" fill="url(#dots)"/>

  <path d="M82 150 H394" stroke="#D8C8AC" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 180 H320" stroke="#D8C8AC" stroke-width="3" stroke-linecap="round"/>

  <path d="M168 280 L234 345 L350 226" fill="none" stroke="#2B2723" stroke-width="26"
