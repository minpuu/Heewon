<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>보드 이전 안내</title>
<style>
  :root { --ink:#1a1a1a; --sub:#666; --line:#e3e3e3; --bg:#fff; --accent:#2f6f73; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eee; --sub:#aaa; --line:#333; --bg:#111; --accent:#7fc2c6; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { color:var(--sub); margin:0 0 16px; }
  button { font:inherit; padding:12px 16px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--ink); width:100%; margin-bottom:10px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  textarea { width:100%; box-sizing:border-box; min-height:120px; font:13px ui-monospace, monospace; border:1px solid var(--line); border-radius:10px; padding:10px; background:transparent; color:var(--ink); }
  .note { font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>보드는 로그인이 필요한 새 주소로 옮겨졌어요</h1>
  <p>이 페이지에는 일정 데이터가 없습니다. 새 주소는 개인 안내로 전달됩니다.</p>
  <p>이 기기에 남아 있는 <b>완료 체크 기록</b>은 아래 버튼으로 백업해 두세요. 기록은 이 기기 밖으로 전송되지 않습니다.</p>
  <button class="primary" id="copy">완료 체크 기록 복사</button>
  <button id="download">파일로 저장</button>
  <textarea id="out" readonly aria-label="완료 체크 기록"></textarea>
  <p class="note" id="msg"></p>
</main>
<script>
(function () {
  var KEYS = ['heewon.board.done.v1', 'heewon.board.hideDone.v1'];
  var data = { exportedAt: new Date().toISOString(), items: {} };
  KEYS.forEach(function (k) {
    try { var v = localStorage.getItem(k); if (v !== null) data.items[k] = v; } catch (e) {}
  });
  var text = JSON.stringify(data, null, 2);
  var out = document.getElementById('out'), msg = document.getElementById('msg');
  out.value = Object.keys(data.items).length ? text : '이 기기에는 저장된 완료 체크 기록이 없어요.';
  document.getElementById('copy').onclick = function () {
    out.select();
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { msg.textContent = '복사했어요.'; })
      .catch(function () { document.execCommand('copy'); msg.textContent = '복사했어요.'; });
  };
  document.getElementById('download').onclick = function () {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = 'board-done-backup.json';
    a.click();
  };
})();
</script>
</body>
</html>
